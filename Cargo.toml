[package]
name = "stream-dlp"
version = "0.3.8"
edition = "2024"
rust-version = "1.93"
description = "A simple native YouTube downloader for Windows and macOS"
license = "MIT"
repository = "https://github.com/Puffinnois/stream-dlp"

[workspace]
members = ["xtask"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tempfile = "3"
dirs = "6"
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
