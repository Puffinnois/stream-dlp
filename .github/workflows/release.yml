name: Release

# `cargo xtask release <bump>` then `git push --follow-tags`: this builds the tagged version on
# Windows and uploads it to a draft GitHub release. Add notes there and press Publish; the in-app
# updater never sees drafts, and shows the notes in its update dialog.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # build.ps1, the installer and the updater take the version from Cargo.toml, not the tag.
      - name: Check tag matches Cargo.toml version
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'Cannot find the version in Cargo.toml.' }
          $expected = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match the Cargo.toml version ($expected)." }

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup default 1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cargo xtask check

      - name: Install Inno Setup
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }

      - name: Build portable app and installer
        id: build
        run: .\build.ps1 -Installer -SkipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Same check as the Package check workflow.
      - name: Check the packaged, installed and updated app find their tools
        run: |
          function Test-Tools([string]$folder) {
            $run = Start-Process -FilePath (Join-Path $folder 'stream-dlp.exe') -ArgumentList '--check-tools' -Wait -PassThru -NoNewWindow
            if ($run.ExitCode -ne 0) { throw "stream-dlp.exe in $folder could not run its bundled tools (exit $($run.ExitCode))." }
          }
          function Update-Silently {
            $run = Start-Process -FilePath $env:UPDATE -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            $run.ExitCode
          }
          Test-Tools $env:PORTABLE
          # The update installer has no tools, so it refuses a first installation.
          if ((Update-Silently) -eq 0) { throw 'The update installer installed without an existing installation.' }
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          $setup = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Silent install failed (exit $($setup.ExitCode))." }
          Test-Tools $target
          # It updates that installation in place (the app is put back) and keeps its tools.
          Remove-Item -LiteralPath (Join-Path $target 'stream-dlp.exe')
          $exit = Update-Silently
          if ($exit -ne 0) { throw "Silent update failed (exit $exit)." }
          Test-Tools $target
        env:
          PORTABLE: ${{ steps.build.outputs.portable }}
          INSTALLER: ${{ steps.build.outputs.installer }}
          UPDATE: ${{ steps.build.outputs.update }}

      # Installed apps download their installer only from this repository's release URL, with
      # GitHub's SHA-256 digest, which gh's upload provides. Up to 0.3.9 they accept only
      # stream-dlp-Setup-Windows-x64.exe; later ones prefer stream-dlp-Update-Windows-x64.exe.
      - name: Create draft release
        run: |
          Get-Item -LiteralPath $env:INSTALLER, $env:UPDATE, $env:ZIP, $env:SUMS | Format-Table Name, Length
          gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --generate-notes $env:INSTALLER $env:UPDATE $env:ZIP $env:SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.build.outputs.installer }}
          UPDATE: ${{ steps.build.outputs.update }}
          ZIP: ${{ steps.build.outputs.zip }}
          SUMS: ${{ steps.build.outputs.sums }}
