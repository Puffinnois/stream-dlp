name: Windows and experimental Mac checks

on:
  # Branches only: a version tag runs the Release workflow, which checks too.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      package_v039:
        description: Also wrap the published v0.3.9 Mac ZIP in a verified DMG
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Formatting, Clippy, Rust and Deno tests
        run: cargo xtask check

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # Skips downloading FFmpeg's source and building it while the script, which pins both, is unchanged.
      - name: Cache FFmpeg build
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg-cache
          key: macos-arm64-ffmpeg-${{ hashFiles('scripts/setup-macos.py') }}
      - name: Build verified Mac helpers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/setup-macos.py --ffmpeg-cache ~/ffmpeg-cache
      - name: Test and package Mac app
        run: python scripts/build-macos.py --skip-tools
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Local video download, merge, session isolation and cancellation
        run: cargo test --locked local_download_pipeline -- --ignored --nocapture
      - name: Check packaged helper paths outside the source directory
        run: |
          mkdir -p "$RUNNER_TEMP/package-check"
          ditto -x -k dist/stream-dlp-macOS-arm64-experimental.zip "$RUNNER_TEMP/package-check"
          cd "$RUNNER_TEMP/package-check"
          app="$PWD/stream-dlp.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/stream-dlp" --check-tools
      - name: Upload experimental package
        uses: actions/upload-artifact@v7
        with:
          name: stream-dlp-macOS-arm64-experimental
          path: |
            dist/stream-dlp-macOS-arm64-experimental.dmg
            dist/stream-dlp-macOS-arm64-experimental.dmg.sha256
            dist/stream-dlp-macOS-arm64-experimental.zip
            dist/stream-dlp-macOS-arm64-experimental.zip.sha256
          if-no-files-found: error
      - name: Package the published v0.3.9 app
        if: github.event_name == 'workflow_dispatch' && inputs.package_v039
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=stream-dlp-macOS-arm64-experimental.zip
          gh release download v0.3.9 --repo "$GITHUB_REPOSITORY" --pattern "$zip" --dir "$RUNNER_TEMP"
          python scripts/build-macos.py --dmg-from-zip "$RUNNER_TEMP/$zip" --sha256 844fba4e9af0b9296d8cdc5ace8a9c497ecedf92d2a932649d22fc83f284b572
      - name: Upload verified v0.3.9 disk image
        if: github.event_name == 'workflow_dispatch' && inputs.package_v039
        uses: actions/upload-artifact@v7
        with:
          name: stream-dlp-v0.3.9-macOS-arm64-dmg
          path: |
            dist/stream-dlp-macOS-arm64-experimental.dmg
            dist/stream-dlp-macOS-arm64-experimental.dmg.sha256
          if-no-files-found: error
      - name: Upload local pipeline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-pipeline-diagnostics
          path: test-output/
          if-no-files-found: ignore
